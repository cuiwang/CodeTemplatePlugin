<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img">
  <title id="title">CodeTemplatePlugin</title>
  <desc id="desc">40x40 plugin icon — document with code brackets</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28C76F"/>
      <stop offset="0.6" stop-color="#34A7FF"/>
      <stop offset="1" stop-color="#7A6CFF"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#F0F2F7"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="40" height="40" rx="6" fill="url(#bgGrad)" />

  <!-- Paper-like inner sheet -->
  <rect x="6" y="6" width="28" height="28" rx="4" fill="#FFFFFF" />

  <!-- Folded corner (top-right) -->
  <path d="M30 6 H34 V10 L30 6 Z" fill="url(#foldGrad)" />

  <!-- Code brackets -->
  <path d="M14 18 L10 20 L14 22" stroke="#5B54FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M26 18 L30 20 L26 22" stroke="#5B54FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Template text lines -->
  <path d="M16 17 H24" stroke="#475569" stroke-width="1.6" stroke-linecap="round" />
  <path d="M16 20 H24" stroke="#475569" stroke-width="1.6" stroke-linecap="round" opacity="0.95"/>
  <path d="M16 23 H21" stroke="#475569" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>

</svg>
